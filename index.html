function cp(id){const i=S.cmp.indexOf(id);if(i>=0)S.cmp.splice(i,1);else if(S.cmp.length>=3)return toast('Compare up to 3 laptops');else S.cmp.push(id);save();toast(i<0?'Added to compare':'Removed from compare');route(1)}

async function doLogin(f){const v=Object.fromEntries(new FormData(f)),k=v.e.trim().toLowerCase(),u=st.get('rt_users',[]).find(u=>(u.e==k||u.m==k)&&u.h==hash(v.pw));if(!k||!v.pw)return fm('Enter your email/mobile and password.','e');if(sb){let em=k;if(!k.includes('@')){const q=await sb.rpc('email_for_mobile',{m:k});em=q.data||''}const r=em?await sb.auth.signInWithPassword({email:em,password:v.pw}):{error:1};if(r.error)return fm('Incorrect details. Check and try again, or create an account.','e');await sbUser(r.data.session);return go('#/home')}if(!u)return fm('Incorrect details. Check and try again, or create an account.','e');S.u={n:u.n,m:u.m,e:u.e};v.rm?st.set('rt_sess',S.u):st.ss('rt_sess',S.u);go('#/home')}

function wish(){return shell(`<div class="wrap sec"><h2>Wishlist</h2>${S.wish.length?`<div class="grid4">${S.wish.map(i=>{const p=pd(i);return `<div>${card(p)}<button class="btn sm ol w" style="margin-top:6px" onclick="wl(${i})">Remove from wishlist</button></div>`}).join('')}</div>`:'<div class="card" style="padding:24px;text-align:center">Nothing saved yet. Tap ♡ on any laptop.</div>'}</div>`)}
function compare(){const L=S.cmp.map(pd),r=(a,f)=>`<tr><th>${a}</th>${L.map(p=>`<td>${f(p)}</td>`).join('')}</tr>`;return shell(`<div class="wrap sec"><h2>Compare laptops</h2>${L.length?`<div class="card sc"><table><tr><th></th>${L.map(p=>`<td><b>${p.b} ${p.m}</b><br><button class="btn sm ol" onclick="cp(${p.id})">Remove</button></td>`).join('')}</tr>${r('Price',p=>inr(p.p))+r('Brand',p=>p.b)+r('Processor',p=>p.cpu)+r('RAM',p=>p.ram+' GB')+r('Storage',p=>p.ssd+' GB')+r('GPU',p=>p.gpu)+r('Display',p=>p.b=='Apple'?'Retina':'15.6" FHD')+r('Refresh rate',p=>p.hz+' Hz')+r('OS',p=>p.b=='Apple'?'macOS':'Windows 11')+r('Battery health',p=>p.bat+'%')+r('Condition',p=>p.cd)+r('Warranty',p=>'6 months')+r('Trust score',p=>p.t+'/100')}</table></div>`:'<div class="card" style="padding:24px;text-align:center">Pick up to 3 laptops using ⇄ on a product card.<br><br><button class="btn" onclick="go(\'#/search\')">Choose laptops</button></div>'}</div>`)}
function sell(){return shell(`<div class="wrap sec"><h2>Sell your laptop</h2><div class="two"><form class="card" style="padding:18px" onsubmit="event.preventDefault();quote(this)"><label>Brand</label><select name="b">${BR.map(b=>`<option>${b}</option>`).join('')}</select><label>Model</label><input name="m" placeholder="e.g. Inspiron 15 3511"><label>Processor</label><input name="cpu" placeholder="e.g. Core i5 11th Gen"><label>RAM</label><select name="ram"><option>4</option><option>8</option><option selected>16</option><option>32</option></select><label>Storage (GB)</label><select name="ssd"><option>256</option><option selected>512</option><option>1024</option></select><label>Condition</label><select name="cd"><option>Like New</option><option selected>Good</option><option>Fair</option><option>Needs repair</option></select><label>Age (years)</label><input name="age" type="number" min="0" max="10" value="2"><label>Battery condition</label><select name="bat"><option>Excellent</option><option selected>Good</option><option>Weak</option></select><label>Other details</label><input name="o" placeholder="Charger, box, warranty…"><div id="fm"></div><br><button class="btn w">Get my offer</button></form><div><div class="card" id="photo" style="padding:18px"><h3 style="margin-top:0">📷 Estimate from a photo</h3><p class="sp">Upload a clear photo of your laptop. Our demo analyser suggests the model, specs and a resale price.</p><input type="file" accept="image/*" onchange="analyse(this)" aria-label="Upload laptop photo"><div id="ph"></div></div></div></div></div>`)}
function quote(f){const v=Object.fromEntries(new FormData(f));if(v.m.trim().length<2||v.cpu.trim().length<2)return fm('Enter the model and processor.','e');let base=({Apple:55000,ASUS:32000,Lenovo:30000,MSI:38000,HP:28000,Dell:27000,Acer:22000})[v.b];base*=(+v.ram/16*.35+.65)*(+v.ssd/512*.2+.8);base*=({'Like New':1,Good:.85,Fair:.65,'Needs repair':.35})[v.cd]*Math.max(.45,1-v.age*.1)*({Excellent:1,Good:.95,Weak:.82})[v.bat];base=Math.round(base/500)*500;const id='SL'+Date.now().toString().slice(-6);const s=st.get('rt_sell',[]);s.push({id,...v,offer:base});st.set('rt_sell',s);if(sb)sb.from('sell_requests').insert({user_id:S.u.id,brand:v.b,model:v.m,cpu:v.cpu,ram:+v.ram,storage:+v.ssd,condition:v.cd,age:+v.age,battery:v.bat,notes:v.o,offer:base});fm(`Request ${id} received. Estimated offer: <b>${inr(base)}</b>. A RETECH agent will call you within 24 hours to schedule a free pickup.`,'s')}
function analyse(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{$('#ph').innerHTML=`<img src="${e.target.result}" alt="Your laptop" style="width:100%;border-radius:12px;margin:12px 0"><div class="msg s">Analysing image…</div><div class="cf"><u id="pb" style="width:0;transition:width 1.8s"></u></div>`;setTimeout(()=>$('#pb').style.width='100%',50);setTimeout(()=>{const p=P[(f.size+f.name.length)%P.length],conf=72+(f.size%20),est=Math.round(p.p*.62/500)*500;$('#ph').innerHTML+=`<div class="card res" style="margin-top:12px"><b>Detected: ${p.b} ${p.m}</b><div class="cf" style="margin:8px 0"><u style="width:${conf}%"></u></div><div class="sp">Confidence ${conf}% · Demo analysis</div><table><tr><th>Processor</th><td>${p.cpu}</td></tr><tr><th>RAM / Storage</th><td>${p.ram} GB / ${p.ssd} GB</td></tr><tr><th>GPU</th><td>${p.gpu}</td></tr></table><div class="pr" style="margin:8px 0">Estimated resale ${inr(est)}</div><p class="sp">Final price is confirmed after RETECH hardware inspection.</p><button class="btn w" onclick="toast('Estimate saved — an agent will contact you');go('#/home')">Accept estimate</button></div>`},2000)};r.readAsDataURL(f)}
function profile(){const u={addr:S.u.addr||(st.get('rt_users',[]).find(x=>x.e==S.u.e)||{}).addr};return shell(`<div class="wrap sec"><h2>Your profile</h2><div class="two"><div class="card" style="padding:18px"><div style="font-size:42px">👤</div><h3 style="margin:4px 0">${S.u.n}</h3><div class="sp">📱 ${S.u.m}<br>✉️ ${S.u.e}<br>📍 ${u.addr||'No saved address yet'}</div><br><button class="btn" onclick="go('#/orders')">Orders (${S.ord.filter(x=>x.user==S.u.e).length})</button> <button class="btn ol" onclick="go('#/wish')">Wishlist (${S.wish.length})</button> <button class="btn ol" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">Toggle theme</button><br><br><button class="btn nv" onclick="logout()">Logout</button></div><div><h3 style="margin-top:0">Recently viewed</h3>${S.rv.length?`<div class="grid4" style="grid-template-columns:repeat(2,1fr)">${S.rv.slice(0,4).map(i=>card(pd(i))).join('')}</div>`:'<div class="card" style="padding:18px">Laptops you open will show up here.</div>'}</div></div></div>`)}
const open_=['', 'login','register'];
function route(keep){const h=location.hash||'#/',[,r,a]=h.split('/'),rt=(r||'').split('#')[0];if(!S.u&&rt=='')return go('#/register');if(!S.u&&!['login','register'].includes(rt))return go('#/register');if(S.u&&['','login','register'].includes(rt))return go('#/home');const y=scrollY;let out;switch(rt){case '':out=welcome();break;case 'login':out=authForm(0);break;case 'register':out=authForm(1);break;case 'home':out=home();break;case 'search':out=search();break;case 'p':if(!keep){S.col=0;S.img=0}out=detail(a);break;case 'cart':out=cart();break;case 'checkout':out=checkout();break;case 'done':out=done();break;case 'orders':out=orders();break;case 'wish':out=wish();break;case 'compare':out=compare();break;case 'sell':out=sell();break;case 'profile':out=profile();break;default:return go('#/')}if(out==null)return;if(['login','register'].includes(rt))out=`<header><div class="wrap hd">${logoH}</div></header>`+out;$('#app').innerHTML=out;if(keep)scrollTo(0,y);else if(h.includes('#photo')&&rt=='sell')$('#photo').scrollIntoView();else scrollTo(0,0)}
addEventListener('hashchange',()=>route());
if(sb){S.u=null;sb.auth.getSession().then(async({data})=>{if(data.session)await sbUser(data.session);route()})}
if(!sb)route();
</script></body></html>
